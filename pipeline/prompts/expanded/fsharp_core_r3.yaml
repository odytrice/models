  instruction: 'Build a parser for game graphics settings using FParsec:

    1. Grammar: key = value pairs, sections [Display], [Quality], [Audio]

    2. Value types: integers (quality levels 0-4), floats (sensitivity/sound volume), booleans (vsync, anti-aliasing), string
    enums (Low/Medium/High/Ultra)

    3. Use FParsec combinators: pstringCI, spaces, skipMany, manySatisfy

    4. Define an AST as discriminated unions for GraphicsSettings, AudioSettings, DisplaySettings

    5. Provide validation that quality levels are within valid ranges

    6. Write a pretty-printer with formatted output and section headers'
- id: fsharp_core_0031_exp_001
  instruction: 'Create a parser for a network firewall rule configuration using FParsec:

    1. Grammar: rule definitions with priority ordering, action (allow/deny), protocol, port ranges, IP masks

    2. Value types: IP addresses with CIDR notation, port ranges (80-443), protocol enum (tcp/udp/icmp/any), integers for
    priority

    3. Use FParsec combinators: pchar, many1, sepBy1, pipe2, opt

    4. Define an AST as discriminated union: FirewallRule with fields for action, protocol, ports, source, destination

    5. Handle overlapping rules with warning messages

    6. Write a pretty-printer that outputs rules in priority order'
- id: fsharp_core_0031_exp_002
  instruction: 'Build a parser for a log4net-style logging configuration using FParsec:

    1. Grammar: hierarchical appenders and loggers, inheritance with appender-ref

    2. Value types: strings, integers (threshold levels), booleans, arrays of strings

    3. Use FParsec combinators: manyTill, between, choice, attempt, many

    4. Define an AST with Appender and Logger discriminated unions, supporting nested appender configurations

    5. Handle circular logger inheritance references with error detection

    6. Write a pretty-printer that maintains the hierarchical structure'
- id: fsharp_core_0031_exp_003
  instruction: 'Create a parser for a markdown frontmatter YAML-like syntax using FParsec:

    1. Grammar: key-value pairs between --- markers, nested objects with indentation

    2. Value types: strings, integers, booleans, dates (ISO 8601), arrays of primitives

    3. Use FParsec combinators: skipManyTill, many1, tab, attempt, pipe3

    4. Define an AST as discriminated union for FrontmatterValue (String, Number, Bool, Date, Array, Object)

    5. Support both quoted and unquoted string values with escape sequences

    6. Write a pretty-printer that preserves the --- delimiters'
- id: fsharp_core_0031_exp_004
  instruction: 'Build a parser for a Terraform-like variable definition file using FParsec:

    1. Grammar: variable blocks with type annotations, default values, descriptions, validation rules

    2. Value types: strings, integers, floats, booleans, arrays, objects with typed fields, maps

    3. Use FParsec combinators: between, many, sepBy, choice, attempt, pipe2

    4. Define an AST with VariableDefinition discriminated union including type info, default, and constraints

    5. Handle type mismatches in defaults with descriptive errors

    6. Write a pretty-printer that outputs properly formatted HCL-like syntax'
- id: fsharp_core_0031_exp_005
  instruction: 'Create a parser for a simple Markdown table dialect using FParsec:

    1. Grammar: pipe-separated columns, header row with separator line, typed cells

    2. Value types: strings, integers, floats, dates, empty cells, cells with alignment markers

    3. Use FParsec combinators: sepBy1, many, many1, anyChar, attempt

    4. Define an AST as Table with headers (list of strings) and rows (list of CellValue lists)

    5. Validate column count consistency across rows

    6. Write a pretty-printer that outputs valid markdown tables with alignment'
- id: fsharp_core_0031_exp_006
  instruction: 'Build a parser for a theme/color scheme configuration using FParsec:

    1. Grammar: color definitions with hex values, RGBA values, named colors, color groups

    2. Value types: hex strings (#RGB, #RRGGBB), rgba(r,g,b,a) format, color names

    3. Use FParsec combinators: pstringCI, between, many, choice, regex

    4. Define an AST as discriminated union for Color, ColorGroup with nested color references

    5. Support color variable substitution (${primaryColor} references)

    6. Write a pretty-printer that outputs theme variables in CSS format'
- id: fsharp_core_0031_exp_007
  instruction: 'Create a parser for a feature flag/toggle configuration using FParsec:

    1. Grammar: simple feature definitions with boolean states, targeting rules, percentage rollouts

    2. Value types: booleans, integers (percentages), strings (feature names), arrays of targeting rules

    3. Use FParsec combinators: pstring, spaces, many, sepBy, opt

    4. Define an AST with FeatureFlag discriminated union containing name, enabled, and optional rules

    5. Validate percentage values are between 0 and 100

    6. Write a pretty-printer that formats feature flags with comments'
- id: fsharp_core_0031_exp_008
  instruction: 'Build a parser for a simple build task configuration using FParsec:

    1. Grammar: task definitions with dependencies, commands, and environment variables

    2. Value types: strings, arrays of strings, key-value maps for environment

    3. Use FParsec combinators: many, sepBy, pipe2, opt, attempt

    4. Define an AST with Task discriminated union including name, dependencies list, and commands

    5. Detect circular task dependencies with clear error messages

    6. Write a pretty-printer that outputs taskfile with proper indentation'
- id: fsharp_core_0031_exp_009
  instruction: 'Create a parser for a Docker compose-like service definition using FParsec:

