prompts:
- id: fsharp_lib_0005_exp_001
  instruction: 'Create an F# healthcare module for patient data access:

    1. A function that retrieves patient records by ID with HIPAA compliance checks

    2. A function that validates the requesting user has appropriate access permissions

    3. A function that redacts sensitive information based on user role

    4. Compose into a single taskResult pipeline that handles both async DB calls and permission errors

    Include error cases for unauthorized access, missing records, and data validation failures.'
