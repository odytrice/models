domain: fsharp_libraries
prompts:
- id: fsharp_lib_0033_exp_012
  instruction: 'Write FsCheck property tests for a F# polynomial expression evaluator. Create:

    1. Custom generator for Polynomial discriminated union (Constant, Linear, Quadratic, Custom)

    2. Shrinker that reduces coefficient magnitudes while preserving degree

    3. Properties: evaluate at x=0 returns constant term, differentiation followed by integration recovers original (up to
    constant)

    4. Conditional property: polynomial degree > 0 ==> derivative degree is one less

    5. Compare naive vs Horner''s method implementation'
- id: fsharp_lib_0033_exp_015
  instruction: 'Implement FsCheck tests for a F# regular expression builder library. Include:

    1. Custom generator for RegexAST discriminated union (Literal, CharClass, Repetition, Concatenation, Alternation)

    2. Shrinker that minimizes AST depth while preserving matching behavior

    3. Properties: regex matches strings with literal, inverse property (regex inverse matches complement)

    4. Conditional property: repetition count > 0 ==> at least one match for single char

    5. Configure large tests (2000) for complex pattern combinations'
- id: fsharp_lib_0033_exp_024
  instruction: 'Write FsCheck property-based tests for a F# bloom filter implementation. Include:

    1. Custom generator for BloomFilterConfig (expected elements, false positive rate)

    2. Shrinker that increases element count to expose false positive thresholds

    3. Properties: elements added are always found (no false negatives), false positives bounded by expected rate

    4. Conditional property: element not added ==> probability of being found < threshold

    5. Test with different hash function counts and bit array sizes'
- id: fsharp_lib_0034_exp_011
  instruction: Create a test suite for an authentication and authorization service. Organize with testList by auth method
    (OAuth, SAML, JWT), testAsync for token validation workflows, Expect.throws for invalid credential scenarios, testProperty
    for generating and validating random JWT claims, and configure sequential execution for tests that share a test database
    to avoid race conditions.
- id: fsharp_lib_0034_exp_014
  instruction: Implement Expecto tests for a real-time collaboration engine (similar to Google Docs). Test concurrent editing
    scenarios with testAsync, use Expect.equal for operational transformation validation, property-based tests for random
    concurrent operations, timeout configuration for sync operations, and focused tests (ftestCase) to debug a specific merge
    conflict resolution issue.
- id: fsharp_lib_0035_exp_005
  instruction: "Build a F# configuration management CLI using Argu with subcommands: `get`, `set`, `list`, `validate`. \n\
    Support dot-notation keys (e.g., `database.connection.timeout`). \nImplement type-safe value setting with DU-based value\
    \ type arguments. \nEnvironment variable fallback for config file locations. \nCustom error handling for type mismatches\
    \ (setting string where int expected). \nPattern match on configuration key paths for dispatch."
- id: fsharp_lib_0035_exp_006
  instruction: "Design a F# container orchestration CLI using Argu with commands: `scale`, `deploy`, `rollback`, `inspect`.\
    \ \nDefine arguments for replica counts, image tags, and resource limits. \nImplement environment variable fallbacks for\
    \ registry credentials and namespace contexts. \nAdd confirmation prompts for destructive operations. \nCustom help text\
    \ formatting with command grouping. \nDemonstrate Argu error formatting for invalid deployment manifests."
- id: fsharp_lib_0035_exp_011
  instruction: "Build a F# service mesh configuration CLI using Argu. \nSubcommands: `inject`, `route`, `policy`, `stats`.\
    \ \nDefine DUs for traffic management rules with [<AltCommandLine>] short flags. \nEnvironment variable fallback for mesh\
    \ control plane endpoints. \nImplement YAML and JSON output formatting options. \nPattern match on policy types for handler\
    \ dispatch. \nError handling for invalid rule configurations."
- id: fsharp_lib_0035_exp_014
  instruction: "Build a F# documentation generation CLI using Argu. \nCommands: `generate`, `serve`, `validate`, `export`.\
    \ \nDefine DUs for documentation formats (Markdown, HTML, PDF). \nSupport source path and output directory arguments.\
    \ \nEnvironment variable fallback for theme configurations. \nPattern match on export format for handler selection. \n\
    Show Argu error formatting for missing source directories."
- id: fsharp_lib_0035_exp_015
  instruction: "Design a F# build pipeline CLI using Argu with commands: `build`, `test`, `package`, `publish`. \nDefine argument\
    \ DUs for build configurations and platform targets. \nSupport incremental builds with cache directory arguments. \nEnvironment\
    \ variable fallbacks for artifact repositories. \nCustom help text showing pipeline stage options. \nError handling for\
    \ circular dependency detection."
- id: fsharp_lib_0035_exp_016
  instruction: "Create a F# feature flag management CLI using Argu. \nSubcommands: `enable`, `disable`, `list`, `config`,\
    \ `evaluate`. \nDefine argument DUs for flag names and targeting rules. \nEnvironment variable fallback for flag service\
    \ endpoints. \nSupport JSON and YAML flag configuration formats. \nPattern matching dispatch based on flag operation type.\
    \ \nShow Argu formatting for invalid flag name formats."
- id: fsharp_lib_0035_exp_019
  instruction: "Create a F# webhook testing CLI using Argu. \nCommands: `send`, `record`, `replay`, `inspect`. \nDefine argument\
    \ DUs for HTTP methods, headers, and payloads. \nEnvironment variable fallbacks for webhook endpoints and auth tokens.\
    \ \nSupport response matching and diff generation. \nPattern match on operation type for handler dispatch. \nShow Argu\
    \ error formatting for malformed JSON payloads."
- id: fsharp_lib_0035_exp_018
  instruction: "Design a F# certificate management CLI using Argu. \nSubcommands: `generate`, `sign`, `verify`, `renew`, `revoke`.\
    \ \nDefine argument DUs for certificate types and validity periods. \nEnvironment variable fallbacks for CA certificates\
    \ and private keys. \nSupport CSR generation and certificate chain operations. \nCustom help text with certificate workflow\
    \ examples. \nError handling for expired or invalid certificates."
- id: fsharp_lib_0035_exp_022
  instruction: "Create a F# A/B testing CLI using Argu. \nCommands: `create`, `activate`, `pause`, `analyze`. \nDefine argument\
    \ DUs for experiment configurations and targeting criteria. \nEnvironment variable fallbacks for analytics endpoints.\
    \ \nSupport variant weight arguments. \nCustom help text with targeting examples. \nShow Argu formatting for conflicting\
    \ experiment settings."
- id: fsharp_lib_0035_exp_023
  instruction: "Build a F# search indexing CLI using Argu. \nSubcommands: `index`, `rebuild`, `optimize`, `delete`. \nDefine\
    \ argument DUs for index names and document types. \nEnvironment variable fallbacks for search service endpoints. \nSupport\
    \ batch size and concurrent indexing options. \nPattern match on index operations. \nError handling for oversized documents."
