domain: fsharp_libraries
max_tokens: 4096
prompts:
- id: fsharp_lib_0033_exp_000
  instruction: 'Write FsCheck property-based tests using xUnit to verify a user authentication system in a web application.
    Include:

    1. Custom Arbitrary for generating valid and invalid email addresses

    2. Property tests for password hashing (same input always produces consistent hash, different salts produce different
    hashes)

    3. Conditional property: tokens should only be generated for valid users ==> returns non-empty token

    4. Model-based testing for a session management system with login/logout operations'
- id: fsharp_lib_0033_exp_001
  instruction: 'Implement property-based tests for a financial transaction processing module in F#. Create:

    1. Custom generator for Transaction records (TransactionId, AccountId, Amount, Timestamp, TransactionType)

    2. Shrinker that reduces transaction amounts logically (not randomly)

    3. Properties: idempotency (processing same transaction twice yields same result), commutative balance updates

    4. Conditional property: negative amounts are always rejected ==> returns validation error

    5. Stateful testing for an account balance manager'
- id: fsharp_lib_0033_exp_002
  instruction: 'Write FsCheck tests for an F# order processing system in an e-commerce platform. Include:

    1. Custom Arbitrary for Order records with LineItem discriminated unions

    2. Shrinker for nested OrderSummary -> Order -> LineItems structure

    3. Properties: total price equals sum of line items, order ID uniqueness

    4. Conditional properties: discount codes only apply when minimum order value is met

    5. Model-based testing for shopping cart operations (add, remove, update quantity, checkout)

    6. Configure 1000 max tests with replay seed for debugging'
- id: fsharp_lib_0033_exp_003
  instruction: 'Create property-based tests using FsCheck and xUnit for a F# event sourcing library. Implement:

    1. Custom generator for DomainEvent discriminated union (Created, Updated, Deleted, Activated events)

    2. Shrinker that produces minimal event sequences that still trigger bugs

    3. Properties: event replay produces same aggregate state, event ordering preserved

    4. Conditional property: timestamp > created_at for all events ==> event is valid

    5. Model-based/stateful testing for aggregate root applying events'
- id: fsharp_lib_0033_exp_004
  instruction: 'Write FsCheck tests for a F# email validation and routing service. Create:

    1. Custom generator for EmailMessage records (From, To, Cc, Bcc, Subject, Body, Attachments)

    2. Shrinker that minimizes attachment count while preserving test failures

    3. Properties: valid emails route to correct queue, invalid emails are rejected

    4. Conditional property: emails with empty recipients are quarantined ==> not delivered

    5. Stateful testing for email queue with priority levels'
- id: fsharp_lib_0033_exp_005
  instruction: 'Implement FsCheck property-based tests for a F# graph traversal library. Include:

    1. Custom Arbitrary for Graph type with nodes and edges (adjacency list representation)

    2. Custom shrinker for Graph that maintains connectivity

    3. Properties: BFS and DFS find paths when they exist, path length is consistent

    4. Conditional property: connected graphs ==> destination reachable from source

    5. Model-based testing for path caching mechanism'
- id: fsharp_lib_0033_exp_006
  instruction: 'Write property-based tests using FsCheck with xUnit for a F# JSON configuration parser. Create:

    1. Custom generator for ConfigSettings record with nested Option types

    2. Shrinker that reduces string lengths and array sizes

    3. Properties: parse -> serialize -> parse round-trip preserves all values

    4. Conditional property: missing required fields ==> returns parse error

    5. Configure verbose output to debug shrinking behavior'
- id: fsharp_lib_0033_exp_007
  instruction: 'Implement FsCheck tests for a F# rate limiter library supporting token bucket algorithm. Include:

    1. Custom generator for RateLimitConfig (requests per second, burst capacity, tokens)

    2. Shrinker that reduces time deltas to minimum failing cases

    3. Properties: tokens never go negative, refill respects time elapsed

    4. Conditional property: sufficient tokens available ==> request allowed

    5. Stateful testing for multi-threaded rate limiter scenarios

    6. Use Gen.oneof to generate both allow and deny outcomes'
- id: fsharp_lib_0033_exp_008
  instruction: 'Write FsCheck property-based tests for a F# roman numeral converter. Create:

    1. Custom generator using Gen.sized to create valid roman numerals up to configurable length

    2. Shrinker that reduces numeral complexity (fewer subtractive notations)

    3. Properties: convert roman to int and back yields original (round-trip identity)

    4. Conditional property: numeral length < 16 ==> conversion succeeds (valid range check)

    5. Compare implementation against known correct conversion table'
- id: fsharp_lib_0033_exp_009
  instruction: 'Implement property-based tests for a F# distributed cache with TTL (time-to-live). Include:

    1. Custom Arbitrary for CacheEntry with expiration timestamp

    2. Shrinker that extends TTL to expose expiration-related bugs

    3. Properties: expired entries are evicted, valid entries are retrievable

    4. Conditional property: key exists and not expired ==> value returned

    5. Model-based testing for cache operations (get, set, delete, expire)

    6. Configure smaller test size (10) for time-dependent tests'
- id: fsharp_lib_0033_exp_010
  instruction: 'Write FsCheck tests for a F# CSV parsing and validation library. Create:

    1. Custom generator for CSVRow discriminated union (ValidRow, InvalidRow, EmptyRow)

    2. Shrinker that produces minimal failing CSV (removes columns to isolate issues)

    3. Properties: valid CSV parses to expected column count, type conversions succeed

    4. Conditional property: row has missing required column ==> validation fails

    5. Configure replay with specific seed to reproduce random failures'
- id: fsharp_lib_0033_exp_011
  instruction: 'Implement property-based tests using FsCheck for a F# validation library. Include:

    1. Custom generator for Person record (Name, Age, Email, SSN with realistic constraints)

    2. Custom shrinker that maintains validation rule violations

    3. Properties: all valid persons pass validation, invalid persons are rejected

    4. Conditional property: age < 0 ==> returns AgeValidationError

    5. Test combinator composition (and, or, not validators)'
- id: fsharp_lib_0033_exp_012
  instruction: 'Write FsCheck property tests for a F# polynomial expression evaluator. Create:

    1. Custom generator for Polynomial discriminated union (Constant, Linear, Quadratic, Custom)

    2. Shrinker that reduces coefficient magnitudes while preserving degree

    3. Properties: evaluate at x=0 returns constant term, differentiation followed by integration recovers original (up to
    constant)

    4. Conditional property: polynomial degree > 0 ==> derivative degree is one less

    5. Compare naive vs Horner''s method implementation'
- id: fsharp_lib_0033_exp_013
  instruction: 'Implement FsCheck tests for a F# URL routing/matching library. Include:

    1. Custom generator for RoutePattern discriminated union (Static, Parameter, Wildcard)

    2. Shrinker for URL strings that preserves pattern match characteristics

    3. Properties: matching route extracts correct parameters, non-matching routes reject

    4. Conditional property: pattern has parameter ==> parameter value extracted

    5. Stateful testing for route registration and matching priority'
- id: fsharp_lib_0033_exp_014
  instruction: 'Write property-based tests using FsCheck for a F# message queue producer/consumer. Create:

    1. Custom generator for Message with headers (correlation ID, timestamp, priority, payload)

    2. Shrinker that reduces payload size to minimal reproducing case

    3. Properties: messages published are eventually received, ordering preserved per partition

    4. Conditional property: consumer lag > threshold ==> alerts triggered

    5. Model-based testing for at-least-once delivery semantics'
- id: fsharp_lib_0033_exp_015
  instruction: 'Implement FsCheck tests for a F# regular expression builder library. Include:

    1. Custom generator for RegexAST discriminated union (Literal, CharClass, Repetition, Concatenation, Alternation)

    2. Shrinker that minimizes AST depth while preserving matching behavior

    3. Properties: regex matches strings with literal, inverse property (regex inverse matches complement)

    4. Conditional property: repetition count > 0 ==> at least one match for single char

    5. Configure large tests (2000) for complex pattern combinations'
- id: fsharp_lib_0033_exp_016
  instruction: 'Write FsCheck property-based tests for a F# inventory management system. Create:

    1. Custom Arbitrary for InventoryItem with SKU, quantity, reorder threshold, supplier

    2. Shrinker that reduces quantities to threshold boundary values

    3. Properties: stock level never goes negative, reorder triggers at correct threshold

    4. Conditional property: quantity < reorderThreshold ==> reorderScheduled

    5. Stateful testing for stock operations (receive, ship, adjust, recount)

    6. Use Gen.two to generate paired inputs for transaction tests'
- id: fsharp_lib_0033_exp_017
  instruction: 'Implement FsCheck tests for a F# IP address parsing and manipulation library. Include:

    1. Custom generator for IPv4 and IPv6 address strings and their binary representations

    2. Shrinker that generates boundary cases (0.0.0.0, 255.255.255.255, etc.)

    3. Properties: parse IPv4 string to int and back is identity, subnet calculation correct

    4. Conditional property: octet > 255 ==> invalid IP format error

    5. Compare CIDR notation parsing across implementations'
- id: fsharp_lib_0033_exp_018
  instruction: 'Write property-based tests using FsCheck for a F# scheduling algorithm. Create:

    1. Custom generator for Task discriminated union (OneTime, Recurring with Frequency, Dependent)

    2. Shrinker that reduces dependency chains to minimal failing depth

    3. Properties: no circular dependencies, scheduled times don''t overlap for same resource

    4. Conditional property: task has unmet dependencies ==> not scheduled

    5. Model-based testing for task queue with priority and dependency resolution'
- id: fsharp_lib_0033_exp_019
  instruction: 'Implement FsCheck tests for a F# credit card number validator (Luhn algorithm). Include:

    1. Custom generator using Gen.map to create valid credit card numbers

    2. Shrinker that changes digits one at a time to find minimal failure

    3. Properties: Luhn checksum validates correctly, different card types recognized by prefix

    4. Conditional property: number fails Luhn ==> invalidCard error returned

    5. Test with specific replay seed to debug edge cases'
- id: fsharp_lib_0033_exp_020
  instruction: 'Write FsCheck property-based tests for a F# file path resolver with symlink support. Create:

    1. Custom generator for FileSystemTree discriminated union (File, Directory, SymLink)

    2. Shrinker that removes symlink targets while preserving link structure

    3. Properties: resolve normalizes paths correctly, circular symlinks detected

    4. Conditional property: path contains symlink ==> resolved path differs from input

    5. Stateful testing for directory traversal operations'
- id: fsharp_lib_0033_exp_021
  instruction: 'Implement FsCheck tests for a F# state machine definition library. Include:

    1. Custom generator for StateMachine with states, events, and transitions

    2. Shrinker that produces minimal state machines with failing transitions

    3. Properties: valid state transitions succeed, invalid transitions rejected

    4. Conditional property: event not in current state''s allowed events ==> transitionError

    5. Model-based testing for FSM with random event sequences

    6. Configure verbose output to trace state transitions'
- id: fsharp_lib_0033_exp_022
  instruction: 'Write property-based tests using FsCheck for a F# time zone conversion library. Create:

    1. Custom generator for ZonedDateTime with timezone offsets and DST transitions

    2. Shrinker that generates boundary times around DST changeovers

    3. Properties: convert to UTC and back to original timezone preserves instant, timezone offset respects DST

    4. Conditional property: time is during DST ==> offset includes DST adjustment

    5. Test historical timezone transitions with specific dates'
- id: fsharp_lib_0033_exp_023
  instruction: 'Implement FsCheck tests for a F# command-line argument parser. Include:

    1. Custom generator for CommandLineSpec discriminated union (Flag, Option, Positional, Command)

    2. Shrinker that reduces argument count and string lengths

    3. Properties: valid arguments parse correctly, type conversions validated

    4. Conditional property: required option missing ==> missingRequiredError

    5. Stateful testing for parser with multiple subcommands

    6. Use Gen.three for generating argument name, value, and expected result triples'
- id: fsharp_lib_0033_exp_024
  instruction: 'Write FsCheck property-based tests for a F# bloom filter implementation. Include:

    1. Custom generator for BloomFilterConfig (expected elements, false positive rate)

    2. Shrinker that increases element count to expose false positive thresholds

    3. Properties: elements added are always found (no false negatives), false positives bounded by expected rate

    4. Conditional property: element not added ==> probability of being found < threshold

    5. Test with different hash function counts and bit array sizes'
- id: fsharp_lib_0033_exp_025
  instruction: 'Implement FsCheck tests for a F# JWT token handling library. Include:

    1. Custom generator for JWTClaims (iss, sub, aud, exp, iat, custom claims as Map)

    2. Shrinker that produces tokens with near-expired timestamps

    3. Properties: valid tokens parse successfully, expired tokens rejected

    4. Conditional property: exp < current time ==> tokenExpired error

    5. Test signature verification with valid and tampered payloads'
- id: fsharp_lib_0033_exp_026
  instruction: 'Write property-based tests using FsCheck for a F# circuit breaker pattern implementation. Create:

    1. Custom generator for CircuitBreakerState (Closed, Open, HalfOpen, with failure counts)

    2. Shrinker that reduces time deltas to minimal failure-triggering sequences

    3. Properties: circuit opens after threshold failures, closes after timeout

    4. Conditional property: failureCount >= threshold ==> state is Open

    5. Stateful testing for circuit breaker with success/failure outcomes

    6. Configure small test size (50) for state machine tests'
- id: fsharp_lib_0033_exp_027
  instruction: 'Implement FsCheck tests for a F# HTML sanitizer library. Include:

    1. Custom generator for HTMLContent discriminated union (SafeText, AllowedTag, DangerousScript, Attribute)

    2. Shrinker that maximizes dangerous content while minimizing safe content

    3. Properties: safe HTML passes through unchanged, script tags are stripped

    4. Conditional property: content contains <script> ==> dangerous content removed

    5. Test attribute whitelist and URL sanitization'
- id: fsharp_lib_0033_exp_028
  instruction: 'Write FsCheck property-based tests for a F# distributed locking mechanism. Create:

    1. Custom generator for LockRequest with resource ID, owner, TTL, and priority

    2. Shrinker that produces minimal lock sequences that cause deadlock conditions

    3. Properties: lock acquisition is mutually exclusive, locks release correctly

    4. Conditional property: lock held by another owner ==> acquire returns denied

    5. Model-based testing for lock lifecycle (acquire, extend, release, expire)

    6. Use Gen.frequency to generate realistic lock acquisition patterns'
- id: fsharp_lib_0033_exp_029
  instruction: 'Implement FsCheck tests for a F# semantic versioning parser and comparator. Include:

    1. Custom generator for SemVer with major, minor, patch, pre-release tags, build metadata

    2. Shrinker that reduces version components while preserving ordering

    3. Properties: version comparison is transitive, equal versions compare as equal

    4. Conditional property: pre-release < release version with same major.minor.patch

    5. Test with specific replay seed to debug version ordering edge cases

    6. Configure 500 max tests for comprehensive version combination coverage'
- id: fsharp_lib_0034_exp_000
  instruction: Implement a comprehensive Expecto test suite for a patient records system in a healthcare application. Include
    testList for organizing tests by domain area (demographics, medical history, prescriptions), testAsync for database queries,
    Expect.wantSome assertions for optional fields, and testProperty for generating random valid SSN patterns using FsCheck.
- id: fsharp_lib_0034_exp_001
  instruction: Write a test suite for an IoT device management service using Expecto. Test device registration (testCase),
    telemetry ingestion with async workflows (testAsync), connection state machine transitions with Expect.equal, and device
    offline/online scenarios. Include a performance test using Expecto.BenchmarkDotNet to validate 10,000 concurrent device
    connections.
- id: fsharp_lib_0034_exp_002
  instruction: Create a refactored Expecto test suite for a financial transaction processor. Replace sequential tests with
    parallel execution configuration, add timeout limits for each test, use Expect.throws for invalid transaction scenarios
