- id: fsharp_lib_0035_exp_000
  instruction: "Build an F# CLI tool for a multi-player game server management system using Argu. \nDefine DUs for commands:\
    \ `start`, `stop`, `restart`, `status`, `configure`. \nEach command should have relevant arguments (port, max-players,\
    \ map, difficulty). \nImplement environment variable fallbacks for server credentials. \nInclude custom error messages\
    \ for common failures (port already in use, insufficient permissions). \nUse pattern matching to dispatch to handler functions\
    \ that simulate server operations."
- id: fsharp_lib_0035_exp_001
  instruction: "Create a F# database migration CLI using Argu with subcommands: `up`, `down`, `status`, `seed`. \nDefine argument\
    \ DUs with [<Mandatory>] for migration version numbers. \nSupport dry-run mode with `--whatif` flag. \nImplement custom\
    \ help text explaining migration precedence. \nShow how Argu formats validation errors when invalid version formats are\
    \ provided. \nInclude undo support with confirmation prompts."
- id: fsharp_lib_0035_exp_002
  instruction: "Design an F# IoT device provisioning CLI using Argu. \nCreate subcommands: `register`, `provision`, `decommission`,\
    \ `list`. \nDevice registration should accept JSON configuration files via [<Unique>] flagged arguments. \nImplement environment\
    \ variable fallback for API endpoints and auth tokens. \nAdd custom usage examples in help text. \nHandle parse errors\
    \ gracefully with user-friendly messages."
- id: fsharp_lib_0035_exp_003
  instruction: "Build an F# log analysis CLI with Argu supporting commands: `tail`, `search`, `aggregate`, `export`. \nUse\
