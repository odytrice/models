- id: fsharp_lib_0035_exp_007
  instruction: "Create a F# file processing pipeline CLI using Argu. \nSubcommands: `process`, `validate`, `transform`, `report`.\
    \ \nSupport glob patterns and individual file arguments with [<Repeated>] attribute. \nEnvironment variable fallback for\
