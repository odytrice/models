- id: fsharp_lib_0038_exp_000
  instruction: 'Implement the transactional outbox pattern in F# for a healthcare appointment scheduling system:

    1. Define OutboxMessage type with PatientId, AppointmentId, EventType, NotificationPayload (JSON), CreatedAt, ProcessedAt

    2. Use Marten with PostgreSQL to save AppointmentCreated/Rescheduled/Cancelled events to OutboxMessages in the same transaction

    3. Implement a BackgroundService that polls unprocessed messages every 500ms

    4. Publish to Azure Service Bus using Microsoft.Azure.ServiceBus for SMS/email notifications

    5. Idempotent consumer that tracks ProcessedMessageIds in Redis for fast deduplication

    6. Include retry logic with exponential backoff for failed message publishing'
- id: fsharp_lib_0038_exp_001
  instruction: 'Create a high-performance F# outbox implementation for an IoT telemetry system:

    1. Define OutboxMessage with DeviceId, SensorType, Readings (JSON), Timestamp, Status

    2. Use raw SqlBulkCopy for batch inserts to OutboxMessages table to handle 10,000+ events/sec

    3. Implement partitioned polling with multiple worker threads (one per partition)

    4. Use Confluent Kafka producer with exactly-once semantics (transactional.idempotence)

    5. Consumer group with offset tracking in both Kafka and local ProcessedMessages table

    6. Backpressure handling using SemaphoreSlim when outbox table exceeds threshold'
- id: fsharp_lib_0038_exp_002
  instruction: 'Implement the outbox pattern in F# using functional composition withRailway Oriented Programming:

    1. Define Result-based OutboxRepository with save, getUnprocessed, markProcessed methods

    2. Domain event types as F# Discriminated Unions mapped to JSON storage

    3. Atomic command handler that wraps aggregate update + outbox insert in a DbTransaction

    4. Implement polling worker as an F# Agent (MailboxProcessor) with configurable interval

    5. Kafka producer as a ResilientPublisher with circuit breaker pattern

    6. Show composition: createOrderCommand >>= saveToOutbox >>= publishToKafka'
- id: fsharp_lib_0038_exp_003
  instruction: 'Design a multi-tenant SaaS outbox system in F# with tenant isolation:

    1. OutboxMessage includes TenantId for all queries with mandatory tenant scoping

    2. Row-level security in PostgreSQL using SET app.current_tenant before queries

    3. Per-tenant Kafka topics: outbox-{tenantId} with proper access controls

    4. BackgroundService per tenant with isolated polling intervals

    5. Consumer processes messages only for authorized tenants

    6. Include tenant quota enforcement for message throughput limits'
- id: fsharp_lib_0038_exp_004
  instruction: 'Implement and debug a failing outbox consumer in F#:

    1. Set up standard outbox with OutboxMessage type and linq2db integration

    2. Add detailed structured logging (Serilog) with correlation IDs

    3. Implement health checks for outbox lag and consumer group status

    4. Create diagnostic endpoints: /outbox/stats, /outbox/stuck-messages, /outbox/retry

    5. Add metrics using AppMetrics for messages_processed, messages_failed, processing_lag_seconds

    6. Debug scenario: explain how to diagnose and fix a stuck consumer with no error logs'
- id: fsharp_lib_0038_exp_005
  instruction: 'Refactor a broken F# order processing service to use the outbox pattern:

    1. Current code uses dual-write: save to Order table then immediately call message broker

    2. Identify and fix race condition where broker fails but order is committed

    3. Extract existing event types into OutboxMessage format

    4. Wrap existing transaction scope to include OutboxMessages table

    5. Add idempotency using OrderEventId as deduplication key

    6. Validate refactoring with integration tests showing consistent behavior'
- id: fsharp_lib_0038_exp_006
  instruction: 'Implement event sourcing with outbox pattern in F#:

    1. Define EventRecord with SequenceNumber, StreamId, EventType, Data, Metadata

    2. EventStoreDB for event storage with optimistic concurrency

    3. Outbox populated from in-memory event stream before EventStoreDB commit

    4. Consumer rebuilds read models by replaying events idempotently

    5. Snapshot strategy for long streams to optimize read model projections

    6. Show eventual consistency window and read model staleness handling'
- id: fsharp_lib_0038_exp_007
  instruction: 'Create a zero-downtime deployment strategy for F# outbox service:

    1. Define versioned OutboxMessage schema with migration strategy

    2. Implement backward-compatible consumer that handles both v1 and v2 payloads

    3. Blue-green deployment: run old and new consumers simultaneously during migration

    4. Schema migration script for OutboxMessages and ProcessedMessages tables

    5. Rolling deploy with health check verification before routing traffic

    6. Rollback procedure if consumer errors exceed threshold'
- id: fsharp_lib_0038_exp_008
  instruction: 'Implement poison message handling in F# outbox pattern:

    1. Configure max retry count (3) and retry interval (1min, 5min, 15min) in OutboxMessage

    2. Move to DeadLetterQueue after exhausting retries with failure reason

    3. Admin API to manually inspect, retry, or discard poison messages

    4. Implement circuit breaker that pauses polling after N consecutive failures

    5. Alert when DeadLetterQueue depth exceeds threshold

    6. Show recovery flow: fix consumer bug -> replay from DLQ -> verify processing'
- id: fsharp_lib_0038_exp_009
  instruction: 'Design a CQRS architecture with outbox pattern in F#:

    1. Command side: save aggregates and outbox messages in single transaction

    2. Query side: materialized views updated by outbox consumer

    3. OutboxMessage includes routing metadata: targetView, projectionVersion

    4. Projections as F# Agents processing messages sequentially per aggregate

    5. Consistency guarantees: show staleness window and read-your-writes handling

    6. Compare synchronous vs eventual consistency read models'
- id: fsharp_lib_0038_exp_010
  instruction: 'Implement outbox pattern with F# for a gaming leaderboard system:

    1. OutboxMessage with PlayerId, GameSessionId, EventType (ScoreUpdated, AchievementUnlocked), ScorePayload

    2. Redis Sorted Set for real-time leaderboard updated synchronously

    3. Outbox consumer updates persistent PostgreSQL leaderboard tables

    4. Handle out-of-order message delivery for late-arriving events

    5. Idempotency using (PlayerId, GameSessionId, EventSequence) tuple

    6. Performance benchmark: show latency impact of outbox vs direct writes'
- id: fsharp_lib_0038_exp_011
  instruction: 'Compare transaction outbox vs change data capture in F#:

    1. Implement identical functionality using both patterns

    2. Outbox: explicit insert to OutboxMessages in same transaction

    3. CDC: PostgreSQL logical replication to Debezium to Kafka

    4. Compare: complexity, latency, delivery guarantees, operational overhead

    5. Benchmark: measure throughput and latency for both approaches

    6. Provide decision matrix for when to use each pattern'
- id: fsharp_lib_0038_exp_012
  instruction: 'Implement a distributed saga with outbox pattern in F#:

    1. OrderSaga with steps: ReserveInventory, ProcessPayment, ShipOrder with compensating transactions

    2. Saga state persisted in OutboxMessages with SagaId, CurrentStep, StepsCompleted

    3. BackgroundService polls sagas awaiting execution, not just unprocessed messages

    4. Implement saga timeout detection using CreatedAt + step timeout threshold

    5. Idempotency using (SagaId, StepType) as deduplication key

    6. Handle partial completion: execute compensating transactions for failed steps'
- id: fsharp_lib_0038_exp_013
  instruction: 'Create a testable F# outbox implementation with property-based testing:

    1. Implement OutboxRepository as an interface for testability

    2. Property-based tests using FsCheck: generate valid OutboxMessage sequences

    3. Verify idempotency: processing same message twice produces same result

    4. Verify atomicity: command failure never produces orphan outbox message

    5. Generate 1000 random failure scenarios (DB down, broker down, timeout) and verify consistency

    6. Include shrinking for failed test cases to aid debugging'
- id: fsharp_lib_0038_exp_014
  instruction: 'Implement F# outbox with PostgreSQL advisory locks for coordination:

    1. Use pg_try_advisory_xact_lock during outbox polling to prevent duplicate processing

    2. OutboxMessage with ProcessingLockId derived from Id % workerCount

    3. Multiple consumer instances safely share same outbox table

    4. Demonstrate lock contention handling and backoff strategies

    5. Compare with Redis-based distributed locks for the same scenario

    6. Measure lock acquisition latency under high concurrency'
- id: fsharp_lib_0038_exp_015
  instruction: 'Implement a schema evolution strategy for F# outbox payloads:

    1. Define OutboxMessage with versioned Payload field using JSON with $schema metadata

    2. Implement upcasting functions: V1Event -> V2Event when schema evolves

    3. Consumer handles mixed-version payloads during migration window

    4. Version compatibility matrix: which consumer versions process which payload versions

    5. Include schema registry (Confluent) for payload validation

    6. Rolling schema migration with backward compatibility requirements'
- id: fsharp_lib_0038_exp_016
  instruction: 'Design an observable F# outbox system with distributed tracing:

    1. Propagate W3C TraceContext through entire flow: command -> outbox -> poll -> publish -> consume

    2. OutboxMessage includes TraceId, SpanId for correlation

    3. OpenTelemetry integration for traces, metrics, and logs

    4. Visualize end-to-end latency from command to consumer acknowledgment

    5. Detect and alert on: message stuck in outbox > threshold, consumer lag increasing

    6. Implement distributed tracing UI with Span timelines for debugging'
- id: fsharp_lib_0038_exp_017
  instruction: 'Implement batch processing optimization for F# outbox:

    1. Poll outbox for up to N messages per iteration (configurable, default 100)

    2. Use batch Kafka producer for efficient network utilization

    3. Consumer processes batches with parallel projection updates

    4. Compare: N=1 (lowest latency) vs N=1000 (highest throughput) tradeoffs

    5. Implement adaptive batching: increase batch size when lag is high

    6. Memory pressure considerations for large batch accumulation'
- id: fsharp_lib_0038_exp_018
  instruction: 'Implement F# outbox for event-driven microservices with contract testing:

    1. Define consumer-driven contracts using Pact for OutboxMessage schemas

    2. Producer validates message structure before publishing to Kafka

    3. Consumer verifies payload shape and handles unknown fields gracefully

    4. Contract tests run in CI before deployment

    5. Implement schema validation using F# type providers for JSON schemas

    6. Show contract evolution without breaking existing consumers'
- id: fsharp_lib_0038_exp_019
  instruction: 'Create a DevOps-ready F# outbox service for Kubernetes:

    1. Containerize outbox consumer as minimal Linux container

    2. Configure liveness/readiness probes for outbox lag monitoring

    3. Implement graceful shutdown with in-flight message completion

    4. Horizontal Pod Autoscaler based on OutboxMessage table row count

    5. Kubernetes ConfigMap for polling interval, batch size, broker config

    6. Include Helm chart with production-ready defaults'
- id: fsharp_lib_0038_exp_020
  instruction: 'Implement secure F# outbox with message-level encryption:

    1. OutboxMessage with encrypted Payload using envelope encryption (DEK wrapped by KEK)

    2. Decrypt payload only in consumer before publishing to Kafka

    3. Support field-level encryption for sensitive data (SSN, credit card)

    4. Key rotation strategy without message re-encryption

    5. Audit logging for message access and decryption attempts

    6. Compliance: GDPR right-to-erasure handling for encrypted payloads'
- id: fsharp_lib_0038_exp_021
  instruction: 'Implement F# outbox recovery after network partition:

    1. Design idempotent producer with exactly-once semantics using Kafka transactions

    2. Consumer tracks processed message IDs with at-least-once delivery guarantee

    3. Implement deduplication window: processed messages kept for 7 days

    4. Detect and handle duplicate messages during partition recovery

    5. Compare at-least-once vs exactly-once delivery tradeoffs

    6. Include chaos engineering test scenarios: kill consumer mid-processing'
- id: fsharp_lib_0038_exp_022
  instruction: 'Create an F# outbox pattern tutorial with step-by-step implementation:

    1. Start with naive dual-write implementation showing its problems

    2. Step 1: Add OutboxMessages table with same schema as command

    3. Step 2: Modify command handler to use single transaction

    4. Step 3: Implement basic polling BackgroundService

    5. Step 4: Add idempotent consumer with ProcessedMessages table

    6. Step 5: Show integration test proving correctness'
- id: fsharp_lib_0038_exp_023
  instruction: 'Implement F# outbox with event ordering guarantees:

    1. OutboxMessage with SequenceNumber per AggregateId for ordering

    2. Consumer processes messages in SequenceNumber order per aggregate

    3. Implement fan-out parallelization while maintaining per-aggregate ordering

    4. Detect gaps in sequence and request retransmission

    5. Handle replay of historical events with correct ordering

    6. Benchmark: throughput impact of ordering requirements'
- id: fsharp_lib_0038_exp_024
  instruction: 'Design a polyglot persistence outbox in F# for microservices:

    1. Outbox spans multiple databases: PostgreSQL (orders), MongoDB (inventory)

    2. Implement two-phase commit consideration (eventual consistency preferred)

    3. Separate outbox tables per microservice boundary

    4. Cross-service event correlation using CorrelationId in all messages

    5. Saga coordinator reads from multiple outboxes

    6. Discuss CAP theorem tradeoffs in this architecture'
- id: fsharp_lib_0038_exp_025
  instruction: 'Implement a load-tested F# outbox system showing performance limits:

    1. Design outbox capable of 50,000 messages/second throughput

    2. Use connection pooling, batch inserts, parallel consumers

    3. Stress test with simulated broker slowdown

    4. Document: what breaks first (DB, broker, memory, CPU)?

    5. Implement graceful degradation under load

    6. Provide horizontal scaling recommendations'
- id: fsharp_lib_0038_exp_026
  instruction: 'Implement F# outbox with event replay and temporal queries:

    1. OutboxMessage with CreatedAt, EventTime (when event occurred), ProcessedAt

    2. Support point-in-time queries: rebuild read model as of specific timestamp

    3. Implement replay API for disaster recovery read model rebuild

    4. Handle schema changes during historical replay

    5. Optimize replay performance for large historical datasets

    6. Show temporal query example: "show orders as they existed 24 hours ago"'
- id: fsharp_lib_0038_exp_027
  instruction: 'Create an F# DSL for composing outbox workflows:

    1. Define Computation Expression for OutboxWorkflow: step { save; publish; consume }

    2. Implement workflow combinators: retry, compensate, timeout

    3. Type-safe workflow definition with compile-time validation

    4. Workflow persistence for long-running processes

    5. Example: compose complex order fulfillment as outbox workflow

    6. Show workflow visualization and debugging capabilities'
- id: fsharp_lib_0039_exp_000
  instruction: Implement an IoT telemetry consumer in F# that processes device sensor data from RabbitMQ. Use topic exchanges
    with wildcards for routing messages from thousands of IoT devices. Implement connection recovery with exponential backoff,
    handle malformed JSON payloads gracefully, and use channel pooling for high-throughput scenarios.
- id: fsharp_lib_0039_exp_001
  instruction: Build a message retry pattern in F# using RabbitMQ.Client where failed messages are requeued to a retry exchange
    with TTL, then routed back to the main queue after exponential backoff delays. Include a circuit breaker to stop consuming
    when the downstream service is unavailable.
- id: fsharp_lib_0039_exp_002
  instruction: Create a priority queue consumer in F# for an order processing system where orders are categorized by priority
    (VIP, standard, bulk). Configure multiple consumer instances with different prefetch counts and demonstrate how to handle
    priority message ordering vs throughput tradeoffs.
- id: fsharp_lib_0039_exp_003
  instruction: Implement a distributed rate limiter in F# using RabbitMQ as the backing store with atomic operations. Use
    a sliding window algorithm with per-user quotas, handle race conditions in multi-instance deployments, and include Lua
    script integration for atomicity.
- id: fsharp_lib_0039_exp_004
  instruction: Build a message choreography system in F# where order fulfillment events trigger downstream saga participants
    through RabbitMQ. Implement compensating transactions for failed steps, track saga state, and ensure exactly-once delivery
    semantics with idempotent consumers.
- id: fsharp_lib_0039_exp_005
  instruction: Create an F# library that wraps RabbitMQ.Client to provide functional pipeline composition for message processing.
    Include computation expressions for clean consumer setup, automatic connection management, and result type handling for
    successful/failed message processing outcomes.
- id: fsharp_lib_0039_exp_006
  instruction: Implement a message batching consumer in F# that aggregates events within a time window before processing.
    Use manual acknowledgment with batch commit, handle partial batches on shutdown, and configure prefetch to balance latency
    and throughput for analytics pipelines.
- id: fsharp_lib_0039_exp_007
  instruction: Build a fanout exchange consumer in F# for a notification system where messages must be delivered to multiple
    independent consumers (email, SMS, push). Implement subscription management, handle consumer crashes with rebalancing,
    and compare fanout vs individual queue approaches.
- id: fsharp_lib_0039_exp_008
  instruction: Create an F# implementation of the outbox pattern using RabbitMQ where database transactions and message publishing
    are atomic. Include deduplication logic for consumers, transaction coordination with SQL persistence, and recovery from
    partial failures.
- id: fsharp_lib_0039_exp_009
  instruction: Implement a message versioning strategy in F# where consumer can handle multiple versions of message schema
    simultaneously. Use content-type headers for routing, implement version conversion functions, and demonstrate graceful
    schema evolution without downtime.
- id: fsharp_lib_0039_exp_010
  instruction: Build a F# ASP.NET Core application with multiple IHostedService consumers processing different message types
    from separate queues. Implement graceful shutdown with in-flight message completion, health check endpoints, and structured
    logging for message processing metrics.
- id: fsharp_lib_0039_exp_011
  instruction: Create a F# implementation of stream processing on top of RabbitMQ for event sourcing. Implement consumer groups,
    offset tracking, and replay capabilities. Handle backpressure when consumers are slower than producers, and compare with
    Kafka's consumer group semantics.
- id: fsharp_lib_0039_exp_012
  instruction: Implement a delayed/scheduled message system in F# using RabbitMQ TTL and dead-letter exchanges. Support scheduling
    messages for future delivery with millisecond precision, handle scheduler restarts gracefully, and implement distributed
    locking for multiple scheduler instances.
- id: fsharp_lib_0039_exp_013
  instruction: Build a message auditing system in F# that mirrors all RabbitMQ traffic to a separate audit queue. Use a tracing
    interceptor to capture publishing and consuming events, store audit records to PostgreSQL, and implement GDPR-compliant
    data retention policies.
- id: fsharp_lib_0039_exp_014
  instruction: Create an F# reactive streams implementation that bridges RabbitMQ with System.Threading.Channels. Implement
    backpressure handling, memory-bounded buffering, and demonstrate composition of multiple RabbitMQ sources into unified
    stream processing pipelines.
- id: fsharp_lib_0039_exp_015
  instruction: Implement a distributed job scheduler in F# using RabbitMQ for job distribution across worker nodes. Include
    job priorities, worker affinity rules, sticky sessions for stateful jobs, and a leader election mechanism using RabbitMQ
    cluster for coordinator failover.
- id: fsharp_lib_0039_exp_016
  instruction: Build a webhook delivery system in F# using RabbitMQ with automatic retries, exponential backoff, and dead-letter
    handling for failed deliveries. Implement delivery receipts, signature verification, and rate limiting per subscriber
    domain.
- id: fsharp_lib_0039_exp_017
  instruction: Create an F# module for chaos engineering that injects failures into RabbitMQ consumers to test system resilience.
    Implement random connection drops, message processing delays, and exception injection. Measure recovery time and message
    loss under various failure scenarios.
- id: fsharp_lib_0039_exp_018
  instruction: Implement a multi-protocol gateway in F# that receives messages via HTTP/WebSocket and publishes to RabbitMQ.
    Include request validation, rate limiting per client, message transformation, and graceful degradation when RabbitMQ is
    unavailable.
- id: fsharp_lib_0039_exp_019
  instruction: Build an F# consumer for RabbitMQ Streams that processes messages with ordering guarantees within partitions.
    Implement partition-aware routing, consumer rebalancing on instance additions/removals, and offset management for exactly-once
    semantics.
- id: fsharp_lib_0039_exp_020
  instruction: Create a CQRS projection updater in F# using RabbitMQ as the event bus. Handle projection rebuilds from event
    replay, implement optimistic concurrency control, and provide eventual consistency guarantees with conflict resolution
    strategies.
- id: fsharp_lib_0039_exp_021
  instruction: Implement a distributed lock manager in F# backed by RabbitMQ with TTL-based expiration. Include lock renewal
    mechanisms, prevent deadlocks with timeout, handle lock holder crashes, and benchmark performance against Redis-based
    implementations.
- id: fsharp_lib_0039_exp_022
  instruction: Build an F# health monitoring system that tracks RabbitMQ consumer lag, message throughput, and error rates.
    Expose Prometheus metrics, trigger alerts on SLA violations, and implement automatic scaling triggers based on queue depth.
- id: fsharp_lib_0039_exp_023
  instruction: Create an F# library implementing the transactional inbox pattern for reliable message handling. Include automatic
    deduplication, in-order processing guarantees, and outbox relay with exactly-once delivery semantics to downstream systems.
- id: fsharp_lib_0039_exp_024
  instruction: Implement a message priority escalation system in F# where consumer processing time determines message priority
    upgrade. Long-running messages get demoted, stuck messages get escalated, and system adapts prefetch based on processing
    velocity.
- id: fsharp_lib_0039_exp_025
  instruction: Build a session-based message router in F# using correlation IDs to maintain conversation state across request/response
    message pairs. Handle session timeouts, implement session persistence across consumer restarts, and track session metrics.
- id: fsharp_lib_0039_exp_026
  instruction: Create an F# implementation of the claim check pattern where large message payloads are stored in object storage
    and only references are sent through RabbitMQ. Implement automatic payload retrieval, compression for medium-sized payloads,
    and streaming for very large messages.
- id: fsharp_lib_0039_exp_027
  instruction: Implement a circuit breaker pattern in F# for RabbitMQ consumers that monitors downstream service health. Trip
    the breaker on consecutive failures, implement half-open state for probing recovery, and demonstrate fallback strategies
    for degraded operation.
- id: fsharp_lib_0039_exp_028
  instruction: Build a message schema registry in F# that validates and stores message schemas from RabbitMQ. Include schema
    evolution rules, backward/forward compatibility checking, and automatic schema migration functions for consumer adaptation.
- id: fsharp_lib_0039_exp_029
  instruction: Create an F# implementation of the pipeline pattern for RabbitMQ message processing with configurable stages
    (validation, transformation, enrichment, routing). Include error handling per stage, stage retry policies, and parallel
    execution for independent stages.
- id: fsharp_lib_0040_exp_000
  instruction: 'Build an ETL pipeline in F# to process healthcare patient records:

    1. Read patient CSV data using FSharp.Data CsvProvider with typed columns for SSN, DOB, diagnosis codes

    2. Validate HIPAA compliance: check SSN format, verify DOB is in past, validate ICD-10 diagnosis codes

    3. Use Result monad with railway-oriented programming to collect all validation errors per patient

    4. Enrich with insurance provider lookup from SQLite database using linq2db

    5. Anonymize sensitive fields (SSN, address) for reporting while preserving referential integrity

    6. Write valid records to PostgreSQL using Npgsql COPY with batch size of 1000

    7. Stream large files with AsyncSeq, keeping memory usage under 500MB'
- id: fsharp_lib_0040_exp_001
  instruction: 'Create a real-time IoT sensor data ingestion pipeline in F#:

    1. Read telemetry CSV files from multiple sensors using FSharp.Data CsvProvider

    2. Validate readings: check temperature ranges (-50 to 150°C), humidity (0-100%), timestamp sequencing

    3. Aggregate data points by sensor ID and time window (5-minute buckets)

    4. Detect anomalies using z-score calculation, flag outliers beyond 3 standard deviations

    5. Write aggregated results to PostgreSQL with Npgsql COPY, include anomaly flags

    6. Generate summary: readings processed, anomalies detected, sensors reporting

    7. Handle sensor malfunctions (stuck values, missing data) gracefully with AsyncSeq'
- id: fsharp_lib_0040_exp_002
  instruction: 'Implement a financial transaction reconciliation ETL in F#:

    1. Read bank statement CSV using FSharp.Data CsvProvider with decimal precision for amounts

    2. Validate transactions: verify amount doesn''t exceed daily limit, check reference format, validate currency codes

    3. Join with internal ledger database using linq2db to find matches

    4. Categorize each transaction: MATCHED, UNMATCHED_BANK_ONLY, UNMATCHED_LEDGER_ONLY

    5. Write reconciliation results to PostgreSQL using Npgsql COPY protocol

    6. Generate report: match rate percentage, total matched amount, unmatched by category

    7. Handle duplicate transaction detection using hash-based deduplication'
- id: fsharp_lib_0040_exp_003
  instruction: 'Build an e-commerce order processing pipeline in F#:

    1. Read order CSV export using FSharp.Data CsvProvider with order ID, customer ID, items, totals

    2. Validate: check customer exists, verify item SKUs are valid, ensure total matches line items

    3. Enrich with customer data (name, address) and product details (price, category) via linq2db joins

    4. Calculate shipping costs based on weight, destination zone, and shipping method

    5. Apply discount rules: VIP customers get 10%, orders over $500 get free shipping

    6. Write processed orders to PostgreSQL using Npgsql COPY with conflict resolution on order ID

    7. Generate summary: orders processed, revenue total, top categories, validation failures'
- id: fsharp_lib_0040_exp_004
  instruction: 'Create a data migration ETL in F# for moving legacy system data:

    1. Read data from legacy CSV export using FSharp.Data CsvProvider (may have encoding issues)

    2. Handle encoding: detect UTF-8, Latin-1, or Windows-1252, convert to UTF-8

    3. Map legacy field names to new schema, apply transformation rules

    4. Validate against new schema constraints: required fields, data types, referential integrity

    5. Write to PostgreSQL using Npgsql COPY with explicit column mapping

    6. Generate migration report: records migrated, records failed, mapping statistics

    7. Support resumable processing using checkpoint files for large migrations'
- id: fsharp_lib_0040_exp_005
  instruction: 'Build a social media analytics ETL pipeline in F# for user engagement data:

    1. Read engagement CSV (posts, likes, comments, shares) using FSharp.Data CsvProvider

    2. Parse timestamps in multiple formats (ISO 8601, Unix epoch, custom formats)

    3. Calculate engagement metrics: likes per post, comments per like ratio, viral coefficient

    4. Aggregate by user, day, and content category

    5. Detect spam accounts: flag users with >100 posts/day or engagement rate >80%

    6. Write analytics results to PostgreSQL using Npgsql COPY

    7. Generate report: total engagement, top content, spam accounts detected'
- id: fsharp_lib_0040_exp_006
  instruction: 'Implement a logistics tracking ETL in F# for shipping data:

    1. Read tracking events CSV using FSharp.Data CsvProvider with tracking number, timestamp, location, status

    2. Validate: verify tracking number format (alphanumeric, 12-20 chars), check status is valid enum

    3. Reconstruct delivery timeline by sorting events chronologically per tracking number

    4. Calculate KPIs: transit time, time at each hub, delivery success rate

    5. Identify delivery exceptions: loops (same location twice), excessive delays, stuck packages

    6. Write to PostgreSQL using Npgsql COPY with UPSERT for updating existing records

    7. Generate operational report: shipments processed, on-time percentage, exception summary'
- id: fsharp_lib_0040_exp_007
  instruction: 'Create an ETL pipeline in F# to process education student records:

    1. Read enrollment CSV using FSharp.Data CsvProvider with student ID, course codes, grades

    2. Validate: verify course prerequisites are met, check grade values are valid (A-F, P/F)

    3. Enrich with course catalog data from database (credits, prerequisites, coreqs)

    4. Calculate GPA, total credits earned, academic standing (probation, good standing)

    5. Identify at-risk students: those with failing grades or below 2.0 GPA

    6. Write to PostgreSQL using Npgsql COPY with batch inserts of 500 records

    7. Generate academic report: enrollment statistics, GPA distribution, at-risk student count'
- id: fsharp_lib_0040_exp_008
  instruction: 'Build a gaming analytics ETL pipeline in F# for player behavior data:

    1. Read game event logs CSV using FSharp.Data CsvProvider (purchase, level complete, item use, etc.)

    2. Parse JSON payload column using FSharp.Json or Thoth.Json

    3. Validate event schema: required fields present, valid event types, reasonable numeric values

    4. Enrich with player profile data from database (account age, subscription tier, lifetime value)

    5. Calculate engagement metrics: session duration, daily active users, retention curves

    6. Write aggregated metrics to PostgreSQL using Npgsql COPY

    7. Stream large log files with AsyncSeq, processing in chunks of 10000 events'
- id: fsharp_lib_0040_exp_009
  instruction: 'Implement a real estate listing ETL in F#:

    1. Read property listings CSV using FSharp.Data CsvProvider with address, price, beds, baths, sqft

    2. Validate: check price range ($10k-$50M), beds/baths reasonable, sqft > 0

    3. Normalize addresses: standardize abbreviations (St->Street), extract ZIP from full address

    4. Calculate derived fields: price per sqft, price per bedroom, age of listing

    5. Join with neighborhood data to enrich with school districts, crime stats

    6. Write to PostgreSQL using Npgsql COPY with ON CONFLICT for updating existing listings

    7. Generate market report: average prices by area, inventory levels, price reductions'
- id: fsharp_lib_0040_exp_010
  instruction: 'Build an inventory management ETL in F# for warehouse stock data:

    1. Read inventory CSV using FSharp.Data CsvProvider with SKU, quantity, warehouse, last_updated

    2. Validate: check quantity >= 0, valid warehouse codes, timestamps not in future

    3. Detect stock anomalies: negative quantities, sudden drops >50%, stuck inventory (no updates in 90 days)

    4. Join with product master data to get reorder points, lead times, supplier info

    5. Calculate reorder recommendations: items below reorder point

    6. Write to PostgreSQL using Npgsql COPY

    7. Generate inventory health report: total SKUs, low stock count, stale inventory value'
- id: fsharp_lib_0040_exp_011
  instruction: 'Create an ETL pipeline in F# to process event sourcing data:

    1. Read event log CSV using FSharp.Data CsvProvider with aggregate_id, sequence, event_type, payload

    2. Validate sequence numbers are contiguous per aggregate, detect gaps

    3. Deserialize JSON payload using Thoth.Json, validate against event schemas

    4. Reconstruct aggregate state by applying events in order

    5. Detect business rule violations during replay

    6. Write to PostgreSQL using Npgsql COPY with idempotency checks (aggregate_id + sequence as PK)

    7. Generate audit report: events processed, gaps found, rule violations'
- id: fsharp_lib_0040_exp_012
  instruction: 'Build an ETL pipeline in F# to debug and fix slow data processing:

    1. Profile existing CSV processing code: identify bottleneck (I/O, parsing, validation, DB writes)

    2. Read CSV using FSharp.Data CsvProvider with performance instrumentation

    3. Implement validation with ChunkEnumerator for batched processing

    4. Add timing metrics to each pipeline stage

    5. Optimize database writes: increase batch size, use COPY, reduce round trips

    6. Implement caching for lookup data to avoid repeated DB queries

    7. Report performance improvements: before/after times for each stage'
- id: fsharp_lib_0040_exp_013
  instruction: 'Refactor an imperative F# ETL to functional style:

    1. Convert mutable variable accumulation pattern to Seq.fold/AsyncSeq

    2. Replace null checks with Option types

    3. Convert early-return error handling to Result/Choice monads

    4. Implement railway-oriented programming to collect all errors

    5. Replace for loops with map/filter/reduce operations

    6. Add computation expressions for cleaner async workflow

    7. Demonstrate before/after code comparison with metrics'
- id: fsharp_lib_0040_exp_014
  instruction: 'Design a high-concurrency ETL pipeline in F#:

    1. Read CSV using FSharp.Data CsvProvider with partitioned file reading

    2. Implement concurrent validation using F# Agent (MailboxProcessor)

    3. Use SemaphoreSlim to limit concurrent database connections

    4. Process multiple files in parallel with AsyncSeq.ParallelChunked

    5. Handle backpressure: slow consumers, bounded queues

    6. Write to PostgreSQL using Npgsql COPY from multiple workers

    7. Benchmark: throughput with 1, 4, 8, 16 concurrent workers'
- id: fsharp_lib_0040_exp_015
  instruction: 'Implement schema evolution handling in F# ETL:

    1. Read CSV with schema version detection (header columns or version column)

    2. Implement schema migration functions for v1->v2, v2->v3, etc.

    3. Apply transformations based on detected schema version

    4. Validate output matches current schema

    5. Handle backward compatibility: add defaults for missing columns

    6. Write to PostgreSQL using Npgsql COPY with schema version tracking

    7. Generate migration report: records by schema version, transformations applied'
- id: fsharp_lib_0040_exp_016
  instruction: 'Build a resilient ETL in F# with retry logic and circuit breakers:

    1. Read CSV using FSharp.Data CsvProvider

    2. Implement retry with exponential backoff for transient failures

    3. Add circuit breaker pattern for database calls (Polly library)

    4. Handle partial batch failures: retry failed rows, log permanently failed

    5. Implement idempotent writes using GUID-based request IDs

    6. Write to PostgreSQL using Npgsql COPY with error recovery

    7. Generate operation report: successful rows, retried rows, permanent failures, circuit breaker trips'
- id: fsharp_lib_0040_exp_017
  instruction: 'Create an ETL pipeline in F# with data quality scoring:

    1. Read CSV using FSharp.Data CsvProvider

    2. Implement validation rules with severity levels (ERROR, WARNING, INFO)

    3. Calculate data quality score per row (percentage of rules passed)

    4. Calculate quality scores per field, per file, per batch

    5. Route records based on quality: high quality to production, low quality to quarantine

    6. Write to PostgreSQL using Npgsql COPY to separate tables

    7. Generate quality report: overall score, scores by field, rules most frequently violated'
- id: fsharp_lib_0040_exp_018
  instruction: 'Implement exactly-once ETL semantics in F#:

    1. Read CSV using FSharp.Data CsvProvider with hash computation per row

    2. Store processed row hashes in tracking table (PostgreSQL)

    3. Check hash existence before processing to skip duplicates

    4. Use database transactions for atomic read-process-write

    5. Implement idempotency keys for database inserts

    6. Write to PostgreSQL using Npgsql COPY with ON CONFLICT DO NOTHING

    7. Generate deduplication report: total rows, duplicates skipped, unique rows written'
- id: fsharp_lib_0040_exp_019
  instruction: 'Build an encrypted data ETL pipeline in F# for PII handling:

    1. Read CSV using FSharp.Data CsvProvider with PII columns (email, phone, SSN)

    2. Implement field-level encryption using AES-256 for PII

    3. Validate encrypted values don''t appear in non-PII fields

    4. Store encryption keys securely (environment variables, key vault)

    5. Implement decryption for authorized processing only

    6. Write encrypted data to PostgreSQL using Npgsql COPY

    7. Generate compliance report: records processed, PII fields encrypted, key usage audit'
- id: fsharp_lib_0040_exp_020
  instruction: 'Create a multi-tenant SaaS ETL pipeline in F#:

    1. Read CSV using FSharp.Data CsvProvider with tenant_id column

    2. Validate tenant isolation: ensure tenant can only access their data

    3. Apply tenant-specific transformation rules and business logic

    4. Enforce row-level security: tag all records with tenant_id

    5. Implement per-tenant rate limiting and quota enforcement

    6. Write to PostgreSQL using Npgsql COPY with tenant_id in all tables

    7. Generate multi-tenant report: records per tenant, quota usage, tenant-specific errors'
- id: fsharp_lib_0040_exp_021
  instruction: 'Build a time-series data processing ETL in F#:

    1. Read time-series CSV using FSharp.Data CsvProvider with timestamp, metric, value columns

    2. Validate timestamp ordering and detect gaps in time series

    3. Handle timezone conversions: normalize all timestamps to UTC

    4. Implement resampling: convert 1-second data to 1-minute averages

    5. Calculate rolling metrics: moving averages, cumulative sums, period-over-period changes

    6. Write to PostgreSQL timescaledb using Npgsql COPY

    7. Generate time-series report: points processed, gaps detected, storage required'
- id: fsharp_lib_0040_exp_022
  instruction: 'Implement data versioning in ETL pipeline using F#:

    1. Read CSV using FSharp.Data CsvProvider

    2. Implement SCD Type 2: add valid_from, valid_to, is_current columns

    3. Detect changes: compare incoming data with current version

    4. Create new version rows for changed records, close old versions

    5. Handle natural keys and business keys correctly

    6. Write to PostgreSQL using Npgsql COPY with version tracking

    7. Generate versioning report: new records, updated records, unchanged records, version count per key'
- id: fsharp_lib_0040_exp_023
  instruction: 'Build an ETL with rollback capability in F#:

    1. Read CSV using FSharp.Data CsvProvider

    2. Implement batch-level transactions with savepoints

    3. Track all writes with rollback identifiers

    4. Implement compensation actions for each write operation

    5. Handle failures mid-batch: rollback current batch, continue with next

    6. Write to PostgreSQL using Npgsql COPY with transaction management

    7. Generate transaction report: batches committed, batches rolled back, compensation actions executed'
- id: fsharp_lib_0040_exp_024
  instruction: 'Create an API aggregation ETL pipeline in F#:

    1. Read CSV with API endpoint configurations using FSharp.Data CsvProvider

    2. Fetch data from multiple REST APIs (with authentication)

    3. Handle rate limiting: implement token bucket algorithm

    4. Merge API responses with CSV data based on key columns

    5. Handle API failures gracefully: use circuit breakers, fallback to cached data

    6. Write aggregated results to PostgreSQL using Npgsql COPY

    7. Generate aggregation report: API calls made, success rate, data merged'
- id: fsharp_lib_0040_exp_025
  instruction: 'Build a comparative analysis ETL in F# showing C# vs F# approaches:

    1. Read same CSV using FSharp.Data CsvProvider

    2. Implement validation pipeline in both C# (with LINQ) and F# (with Result)

    3. Compare code complexity: lines of code, cyclomatic complexity

    4. Compare performance: processing speed, memory usage

    5. Compare error handling: how each handles edge cases

    6. Write results to PostgreSQL using Npgsql COPY

    7. Generate comparison report: metrics for both languages, recommendations'
- id: fsharp_lib_0040_exp_026
  instruction: 'Implement a partial failure handling ETL in F#:

    1. Read CSV using FSharp.Data CsvProvider

    2. Implement per-row error handling: one bad row doesn''t fail entire batch

    3. Collect all validation errors with detailed messages and row numbers

    4. Process valid rows, collect invalid rows separately

    5. Write valid rows using Npgsql COPY, log invalid rows to error table

    6. Implement retry mechanism for transient database errors

    7. Generate detailed error report: total errors, errors by type, sample error messages'
- id: fsharp_lib_0040_exp_027
  instruction: 'Build observability into an ETL pipeline using F#:

    1. Read CSV using FSharp.Data CsvProvider with structured logging

    2. Instrument each pipeline stage with timing and count metrics

    3. Emit structured logs (JSON) for each processing stage

    4. Track row-level lineage: input row -> output row(s) mapping

    5. Implement health checks: database connectivity, disk space, memory usage

    6. Write metrics to PostgreSQL metrics table using Npgsql COPY

    7. Generate observability report: latency percentiles, throughput, resource usage, error rates'
- id: fsharp_lib_0040_exp_028
  instruction: 'Create a self-healing ETL pipeline in F#:

    1. Read CSV using FSharp.Data CsvProvider with automatic retry

    2. Implement common data quality fixes: trim whitespace, standardize casing, parse dates

    3. Detect and fix common issues: duplicate whitespace, encoding problems, date format variations

    4. Log all automatic fixes applied with before/after values

    5. Escalate unfixable issues to manual review queue

    6. Write fixed data to PostgreSQL using Npgsql COPY

    7. Generate healing report: fixes applied by category, fixes that helped, issues escalated'
