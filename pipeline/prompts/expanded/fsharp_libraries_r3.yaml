- id: fsharp_lib_0036_exp_000
  instruction: Implement a product catalog management system using Dapper.FSharp with PostgreSQL for an e-commerce platform.
    Define F# record types for Products, Categories, and ProductCategories tables with proper foreign key relationships. Write
    type-safe queries to fetch products by category, implement pagination with OFFSET/FETCH, and handle nullable fields for
    product descriptions and images using Option types.
- id: fsharp_lib_0036_exp_001
  instruction: Build a healthcare appointment scheduling system using Dapper.FSharp with PostgreSQL. Create F# records for
    Patients, Doctors, and Appointments tables. Implement type-safe insert operations with date/time validation, write queries
    to find available appointment slots, and use left joins to get doctor information with their appointment counts. Handle
    edge cases for double-booking prevention.
- id: fsharp_lib_0036_exp_002
  instruction: Create a fintech transaction processing module using Dapper.FSharp with PostgreSQL for a banking application.
    Define F# records for Accounts, Transactions, and TransactionTypes tables. Implement type-safe debit/credit operations
    within transactions, write aggregation queries to calculate account balances using SUM, and include proper error handling
    for insufficient funds scenarios.
- id: fsharp_lib_0036_exp_003
  instruction: Design a social media content management system using Dapper.FSharp with PostgreSQL. Define F# record types
    for Users, Posts, Comments, and Likes tables. Implement complex joins to retrieve posts with comment counts and like totals,
    write queries using GROUP BY to find most active users, and handle soft deletes for posts using an IsDeleted flag with
    Option<bool> in F#.
- id: fsharp_lib_0036_exp_004
  instruction: Build an IoT sensor data aggregation system using Dapper.FSharp with PostgreSQL. Define F# records for Sensors,
    Readings, and Locations tables. Implement queries with time-range filtering using DateTime parameters, write aggregation
