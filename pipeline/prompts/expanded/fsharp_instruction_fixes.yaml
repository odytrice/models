    - Persistence: Cassandra for time-series storage, Akka.Persistence for checkpointing

    - Akka.NET: Actor per device for stateful aggregation (avg/min/max per hour)

    - Constraints: Handle 100k messages/second with <50ms latency

    - Include stream restart strategies for temporary network failures

    Show the Graph DSL configuration and actor supervision hierarchy.


    Implement all code in F#.'
  domain: ''
