prompts:
- id: cross_0006_exp_000
  instruction: 'Implement a HIPAA-compliant CI/CD pipeline for a healthcare patient records system:

    - GitLab CI: Build a F# FHIR API (.NET 8) with unit tests and integration tests against a PostgreSQL container

    - GitLab CI: Build a React TypeScript frontend with accessibility (a11y) testing

    - Docker: Multi-stage builds with distroless base images, scan for vulnerabilities using Trivy

    - Push to Azure Container Registry with content trust (Notary) signing

    - Kubernetes: Blue-green deployment strategy with Istio traffic splitting

    - Database: FluentMigrator migrations with encrypted column transformations, run as Kubernetes Job with resource limits

    - Audit: Log all migration executions to Azure Blob Storage for compliance

    - Health checks: Custom readiness probes checking FHIR endpoint conformance

    Show the complete `.gitlab-ci.yml`, Kubernetes manifests with Istio VirtualService, and FluentMigrator configuration with
    transaction rollback on failure.


    Implement all code in F#.'
  domain: ''
- id: cross_0007_exp_006
  instruction: 'Debug a production memory leak in Akka.NET actors: Analyze a scenario where message processing causes Gen
    2 heap growth due to captured closures in HttpHandler chains. Provide diagnostic steps using dotnet-counters and heap
    dumps. Implement the fix using the "Warbler" pattern to prevent closure allocations. Show how to implement bounded mailbox
    queues to prevent out-of-memory errors under load. Include unit tests using Akka.NET TestKit to reproduce the memory leak
    and verify the fix.


    Implement all code in F#.'
  domain: ''
