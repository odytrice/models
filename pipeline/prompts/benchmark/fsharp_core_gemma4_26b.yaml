  instruction: 'Implement active patterns in F# for classifying network connection states:

    1. A partial active pattern that identifies "Connected", "Disconnected", or "Connecting" states from a status code

    2. A parameterized active pattern that validates URLs against specific protocols (http/https)

    3. A multi-case active pattern that categorizes latency as Excellent, Good, Fair, or Poor

    Include match expressions demonstrating each pattern with real-world networking scenarios.'
