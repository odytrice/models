  instruction: Create an F# "Transaction" computation expression builder for banking operations that accumulates authorization failures. The Transaction type should be either Approved<'T> or Denied<string list>. Implement Bind, Return, and MergeSources. Show a multi-step transaction validation checking account balance, fraud score, and daily limits.
